name: Build So Xe APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Thiếu một hoặc nhiều Android signing secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > so-xe-release.jks
          keytool -list -keystore so-xe-release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk So-Xe-Android-2.0.7.apk
      - name: Verify package and permanent signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs So-Xe-Android-2.0.7.apk > apk-signature.txt
          cat apk-signature.txt
          RAW_SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' apk-signature.txt | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_SHA1=$(printf '%s' "$RAW_SHA1" | sed 's/../&:/g; s/:$//')
          EXPECTED_SHA1='F5:91:29:27:7A:B5:0D:7C:98:37:D7:EE:27:C9:63:E7:2F:BE:50:50'
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Sai chữ ký APK. Mong đợi $EXPECTED_SHA1 nhưng nhận được $ACTUAL_SHA1"
            exit 1
          fi
          {
            echo "Package name: vn.soxe.app"
            echo "Version: 2.0.7 (versionCode 12)"
            echo "SHA-1: $ACTUAL_SHA1"
            echo "Đây là chữ ký release cố định dùng cho các bản cập nhật sau."
          } > Android-OAuth-SHA1.txt
          cat Android-OAuth-SHA1.txt
      - name: Publish permanent APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.7 >/dev/null 2>&1; then
            gh release upload v2.0.7 So-Xe-Android-2.0.7.apk Android-OAuth-SHA1.txt --clobber
          else
            gh release create v2.0.7 So-Xe-Android-2.0.7.apk Android-OAuth-SHA1.txt --target "$GITHUB_SHA" --title "Sổ Xe Android 2.0.7" --notes "Thêm loại xe Điện-Xăng với đầy đủ chi phí xăng, sạc xe và thuê pin. Báo cáo tháng tự ẩn cột không áp dụng cho xe điện hoặc xe xăng/dầu. Cài đè lên bản 2.0.3 đến 2.0.6 để cập nhật và giữ nguyên dữ liệu."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: So-Xe-Android-2.0.7-release
          path: |
            So-Xe-Android-2.0.7.apk
            Android-OAuth-SHA1.txt
            apk-signature.txt
          if-no-files-found: error
          retention-days: 30
