name: Build So Xe APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk So-Xe-Android.apk
      - name: Publish permanent APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo "Release v1.3.0 đã tồn tại; giữ nguyên APK và chữ ký hiện có."
          else
            gh release create v1.3.0 So-Xe-Android.apk --target "$GITHUB_SHA" --title "Sổ Xe Android 1.3.0" --notes "Bản cài đặt Android. Ứng dụng tự nhận các cập nhật mới từ GitHub Pages."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: So-Xe-Android
          path: So-Xe-Android.apk
          if-no-files-found: error
          retention-days: 30
