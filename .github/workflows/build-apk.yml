name: Build So Xe APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: |
          gradle --no-daemon :app:signingReport > signing-report.txt
          gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk So-Xe-Android-2.0.0.apk
          SHA1=$(awk '/Variant: debug/{seen=1} seen && /SHA1:/{print $2; exit}' signing-report.txt)
          {
            echo "Package name: vn.soxe.app"
            echo "SHA-1: $SHA1"
            echo "Dùng hai giá trị này để tạo OAuth Client loại Android."
          } > Android-OAuth-SHA1.txt
      - name: Publish permanent APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "Release v2.0.0 đã tồn tại; giữ nguyên APK và chữ ký hiện có."
          else
            gh release create v2.0.0 So-Xe-Android-2.0.0.apk Android-OAuth-SHA1.txt --target "$GITHUB_SHA" --title "Sổ Xe Android 2.0.0" --notes "Ứng dụng Android độc lập: toàn bộ chức năng nằm trong APK, dùng được khi mất mạng và đồng bộ Google Drive trực tiếp từ ứng dụng."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: So-Xe-Android-2.0.0
          path: |
            So-Xe-Android-2.0.0.apk
            Android-OAuth-SHA1.txt
          if-no-files-found: error
          retention-days: 30
