name: Build So Xe Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'docs/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Create checksum
        shell: pwsh
        run: |
          $file = 'dist/So-Xe-Windows-Setup-1.0.0.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          "SHA-256: $hash`nFile: So-Xe-Windows-Setup-1.0.0.exe" | Set-Content -Encoding UTF8 -NoNewline 'dist/So-Xe-Windows-SHA256.txt'
          Get-Content 'dist/So-Xe-Windows-SHA256.txt'
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-v1.0.0'
          $installer = 'dist/So-Xe-Windows-Setup-1.0.0.exe'
          $checksum = 'dist/So-Xe-Windows-SHA256.txt'
          if (gh release view $tag 2>$null) {
            gh release upload $tag $installer $checksum --clobber
          } else {
            gh release create $tag $installer $checksum --target $env:GITHUB_SHA --title 'Sổ Xe Windows 1.0.0' --notes 'Bộ cài Windows độc lập, sử dụng được offline và tự đồng bộ Google Drive khi có mạng. Dữ liệu lưu tại vùng riêng SoXeData và được giữ khi cập nhật hoặc gỡ ứng dụng.'
          }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: So-Xe-Windows-1.0.0
          path: |
            windows/dist/So-Xe-Windows-Setup-1.0.0.exe
            windows/dist/So-Xe-Windows-SHA256.txt
          if-no-files-found: error
          retention-days: 30
